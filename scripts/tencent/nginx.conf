server {
    listen 80;
    server_name 242424.art www.242424.art;
    client_max_body_size 10m;
    gzip on;
    gzip_types application/javascript application/json application/xml text/css image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location ^~ /__showcase/v/ {
        alias /opt/notionnext/public/__showcase-assets/v/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /_next/ {
        alias /opt/notionnext/public/__showcase-assets/_next/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /__zh/ {
        alias /opt/notionnext/public/__showcase-assets/__zh/;
        add_header Cache-Control "no-cache";
    }
    location /blog {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_cache off;
    }
    location / {
        proxy_pass http://127.0.0.1:9010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_cache off;
    }
}
